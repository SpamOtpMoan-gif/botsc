name: Flutter Build Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build/job ID"
        required: true
        type: string
      userId:
        description: "Telegram user ID"
        required: true
        type: string
      payload:
        description: "JSON payload: url, buildType, flutterVersion, ..."
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flutter-build-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  JOB_ID: ${{ inputs.jobId }}
  PAYLOAD: ${{ inputs.payload }}
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build Flutter APK ${{ inputs.jobId }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 00 • Initialize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/output" "$RUNNER_TEMP/work"
          echo "::notice title=BUILD_PROGRESS::0|INITIALIZING|Menyiapkan runner"

      - name: 05 • Validate payload
        id: config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p = json.loads(os.environ["PAYLOAD"])
          url = str(p.get("url") or "").strip()
          if not url:
              raise SystemExit("payload.url tidak ditemukan")
          mode = str(p.get("buildType") or "release").lower()
          if mode not in {"debug", "profile", "release"}:
              mode = "release"
          flutter = str(p.get("flutterVersion") or "").strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("url=" + url + "\n")
              f.write("mode=" + mode + "\n")
              f.write("flutter=" + flutter + "\n")
          print("mode:", mode)
          print("flutter:", flutter or "stable")
          print("url:", url[:120])
          PY
          echo "::notice title=BUILD_PROGRESS::5|CONFIG|Payload build valid"

      - name: 10 • Download source ZIP
        shell: bash
        env:
          SOURCE_URL: ${{ steps.config.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::notice title=BUILD_PROGRESS::12|DOWNLOAD|Mengunduh source ZIP"
          mkdir -p "$RUNNER_TEMP/source"
          python3 - <<'PY'
          import os, urllib.request, urllib.parse
          url = os.environ["SOURCE_URL"]
          out = os.path.join(os.environ["RUNNER_TEMP"], "source.zip")
          headers = {"User-Agent": "duta-script-flutter-worker/3"}
          # Only attach the repository token to URLs belonging to this repository.
          repo_prefix = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/"
          if url.startswith(repo_prefix):
              headers["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              headers["Accept"] = "application/octet-stream"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=300) as r, open(out, "wb") as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)
          size = os.path.getsize(out)
          if size < 100:
              raise SystemExit("Downloaded ZIP terlalu kecil")
          print("Downloaded bytes:", size)
          PY

      - name: 15 • Extract ZIP safely
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=BUILD_PROGRESS::20|EXTRACT|Mengekstrak project dengan aman"
          python3 - <<'PY'
          import os, zipfile
          src = os.path.join(os.environ["RUNNER_TEMP"], "source.zip")
          dst = os.path.join(os.environ["RUNNER_TEMP"], "source")
          root = os.path.realpath(dst)
          os.makedirs(dst, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("ZIP corrupt pada entry: " + bad)
              for info in z.infolist():
                  out = os.path.realpath(os.path.join(dst, info.filename))
                  if not (out == root or out.startswith(root + os.sep)):
                      raise SystemExit("Unsafe ZIP path: " + info.filename)
              z.extractall(dst)
          print("Extracted to:", dst)
          PY

      - name: 20 • Detect Flutter project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/source"
          PROJECT=""
          if [ -f "$ROOT/pubspec.yaml" ]; then
            PROJECT="$ROOT"
          else
            PROJECT="$(find "$ROOT" -maxdepth 8 -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          fi
          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/pubspec.yaml" ]; then
            echo "::error title=NO_FLUTTER_PROJECT::pubspec.yaml tidak ditemukan"
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT"
          echo "::notice title=BUILD_PROGRESS::25|DETECT|Flutter project ditemukan"

      - name: 25 • Inspect project compatibility
        working-directory: ${{ steps.locate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          s = open("pubspec.yaml", encoding="utf-8", errors="ignore").read()
          m = re.search(r'(?ms)^environment:\s*\n(?:^[ \t]+.*\n)*?^[ \t]+sdk:\s*[\'\"]([^\'\"]+)', s)
          print("Dart SDK constraint:", m.group(1) if m else "unknown")
          PY
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            grep -E '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties || true
          else
            echo "Gradle wrapper: not found (Flutter project may regenerate it)"
          fi
          echo "::notice title=BUILD_PROGRESS::30|COMPATIBILITY|Memeriksa konfigurasi Android"

      - name: 30 • Set up Java 17 (no dependency cache)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 31 • Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -n "${JAVA_HOME:-}" || { echo "JAVA_HOME kosong"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME"
          echo "::notice title=BUILD_PROGRESS::35|JAVA|Java 17 siap"

      - name: 35 • Set up Flutter stable
        if: steps.config.outputs.flutter == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: false

      - name: 36 • Set up requested Flutter version
        if: steps.config.outputs.flutter != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.config.outputs.flutter }}
          cache: false
          pub-cache: false

      - name: 40 • Verify Flutter and Android SDK
        working-directory: ${{ steps.locate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter doctor -v || true
          echo "::notice title=BUILD_PROGRESS::40|FLUTTER|Flutter dan Android toolchain siap"

      - name: 45 • Prepare Android project
        working-directory: ${{ steps.locate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            echo "::error title=ANDROID_FOLDER_MISSING::Folder android/ tidak ditemukan"
            exit 1
          fi
          # Keep the project Gradle wrapper unless it is clearly unusable.
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew || true
          fi
          echo "::notice title=BUILD_PROGRESS::45|GRADLE|Android project siap"

      - name: 50 • Flutter pub get
        working-directory: ${{ steps.locate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=BUILD_PROGRESS::55|PUB_GET|Mengambil dependencies"
          flutter pub get

      - name: 60 • Build attempt 1
        id: build1
        working-directory: ${{ steps.locate.outputs.project }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "::notice title=BUILD_PROGRESS::65|BUILD|Build APK pertama"
          case "${{ steps.config.outputs.mode }}" in
            debug) flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/work/build-error-1.log" ;;
            profile) flutter build apk --profile 2>&1 | tee "$RUNNER_TEMP/work/build-error-1.log" ;;
            *) flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/work/build-error-1.log" ;;
          esac

      - name: 65 • AI Auto-Fix (Groq, constrained)
        id: autofix
        if: steps.build1.outcome == 'failure'
        working-directory: ${{ steps.locate.outputs.project }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=BUILD_PROGRESS::70|AI_AUTO_FIX|Menganalisis error build"
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY belum tersedia. Auto-fix dilewati."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, urllib.request
          p = os.path.join(os.environ["RUNNER_TEMP"], "work", "build-error-1.log")
          log = open(p, encoding="utf-8", errors="ignore").read()[-28000:]
          prompt = """You are a Flutter/Android CI repair assistant.
          Return ONLY valid JSON with this exact shape:
          {"diagnosis":"short explanation","patches":[{"path":"relative/path","find":"exact existing text","replace":"replacement text"}]}
          Rules:
          - Maximum 3 patches.
          - Paths may ONLY be pubspec.yaml or start with android/.
          - Never return shell commands.
          - Never add or expose secrets/tokens.
          - Never modify lib/, test/, assets/, or application Dart code.
          - Prefer the smallest compatibility fix.
          - The find text MUST already exist exactly.
          Build log follows:
          """ + log
          body = json.dumps({"model":"openai/gpt-oss-120b","temperature":0,"messages":[
              {"role":"system","content":"Return valid JSON only. No markdown."},
              {"role":"user","content":prompt}
          ]}).encode()
          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=body,
              headers={"Authorization":"Bearer "+os.environ["GROQ_API_KEY"],"Content-Type":"application/json"}
          )
          with urllib.request.urlopen(req, timeout=120) as r:
              data = json.load(r)
          content = data["choices"][0]["message"]["content"].strip()
          if content.startswith("```"):
              content = content.replace("```json", "", 1).replace("```", "", 1).strip()
          parsed = json.loads(content)
          patches = parsed.get("patches") or []
          if len(patches) > 3:
              raise SystemExit("AI returned too many patches")
          open(os.path.join(os.environ["RUNNER_TEMP"], "work", "groq.json"), "w", encoding="utf-8").write(json.dumps(parsed))
          print(json.dumps(parsed, indent=2))
          PY

          python3 - <<'PY'
          import json, os, re
          root = os.path.realpath(os.getcwd())
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "work", "groq.json"), encoding="utf-8"))
          patches = data.get("patches") or []
          if not patches:
              raise SystemExit("AI tidak menghasilkan patch yang dapat diterapkan")
          for patch in patches:
              path = str(patch.get("path") or "")
              find = str(patch.get("find") or "")
              repl = str(patch.get("replace") or "")
              if not (path == "pubspec.yaml" or path.startswith("android/")):
                  raise SystemExit("Blocked AI patch path: " + path)
              full = os.path.realpath(os.path.join(root, path))
              if not full.startswith(root + os.sep):
                  raise SystemExit("Blocked path traversal")
              if len(find) > 12000 or len(repl) > 12000:
                  raise SystemExit("AI patch terlalu besar")
              if re.search(r'(curl|wget|Invoke-WebRequest|powershell|rm -rf|chmod\s+\+x\s+/|base64\s+-d|secret|token|api[_-]?key)', repl, re.I):
                  raise SystemExit("Blocked suspicious AI replacement")
              if not os.path.isfile(full):
                  raise SystemExit("Patch target missing: " + path)
              s = open(full, encoding="utf-8", errors="ignore").read()
              if not find or find not in s:
                  raise SystemExit("Patch context not found: " + path)
              open(full, "w", encoding="utf-8").write(s.replace(find, repl, 1))
              print("Applied AI patch:", path)
          PY

      - name: 75 • Verify AI patch and pub get
        if: steps.build1.outcome == 'failure' && steps.autofix.outcome == 'success'
        working-directory: ${{ steps.locate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=BUILD_PROGRESS::80|PATCH_VERIFY|Memverifikasi patch AI"
          flutter pub get

      - name: 80 • Build attempt 2
        id: build2
        if: steps.build1.outcome == 'failure' && steps.autofix.outcome == 'success'
        working-directory: ${{ steps.locate.outputs.project }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "::notice title=BUILD_PROGRESS::85|REBUILD|Build ulang setelah auto-fix"
          case "${{ steps.config.outputs.mode }}" in
            debug) flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/work/build-error-2.log" ;;
            profile) flutter build apk --profile 2>&1 | tee "$RUNNER_TEMP/work/build-error-2.log" ;;
            *) flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/work/build-error-2.log" ;;
          esac

      - name: 90 • Verify APK
        id: verify
        if: steps.build1.outcome == 'success' || steps.build2.outcome == 'success'
        working-directory: ${{ steps.locate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=BUILD_PROGRESS::97|VERIFY|Memeriksa hasil APK"
          APK="$(find build/app/outputs -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            APK="$(find android/app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi
          [ -n "$APK" ] || { echo "::error title=APK_MISSING::APK tidak ditemukan setelah build"; exit 1; }
          cp "$APK" "$RUNNER_TEMP/output/app-${{ inputs.jobId }}.apk"
          ls -lh "$RUNNER_TEMP/output/app-${{ inputs.jobId }}.apk"
          sha256sum "$RUNNER_TEMP/output/app-${{ inputs.jobId }}.apk"

      - name: 95 • Upload artifact
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ runner.temp }}/output/app-${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: 100 • Success
        if: steps.verify.outcome == 'success'
        shell: bash
        run: echo "::notice title=BUILD_PROGRESS::100|UPLOAD|APK berhasil diupload"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.jobId }}
          path: |
            ${{ runner.temp }}/work/*.log
            ${{ runner.temp }}/work/groq.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Final failure
        if: steps.build1.outcome == 'failure' && steps.build2.outcome != 'success'
        shell: bash
        run: |
          echo "::error title=BUILD_FAILED::Build gagal setelah worker menjalankan auto-fix/rebuild."
          echo "=== BUILD ERROR ==="
          tail -n 220 "$RUNNER_TEMP/work/build-error-2.log" 2>/dev/null || tail -n 220 "$RUNNER_TEMP/work/build-error-1.log" 2>/dev/null || true
          exit 1
